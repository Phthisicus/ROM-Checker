# Add inside your existing HTTPS server block.
# Set ROMCHECKER_PATH_BASE=/romchecker. For a dedicated hostname, use location /
# and leave ROMCHECKER_PATH_BASE empty.
location = /romchecker {
    return 308 /romchecker/;
}

location /romchecker/ {
    # No trailing slash: preserve /romchecker/ in the upstream request.
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    client_body_timeout 3600s;
    # Transfers use bounded 8 MiB chunks, not a single huge upload.
    client_max_body_size 9m;
}
