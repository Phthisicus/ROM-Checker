name: Delivery
on:
  push:
    branches: [development, beta, main]
permissions:
  contents: read
env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_ATTEMPT: ${{ github.run_attempt }}
  WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
# Serialize both channels so tag allocation and moving aliases cannot race.
# GitHub retains only the newest pending run in a concurrency group.
concurrency:
  group: delivery-${{ github.ref_name == 'development' && 'development' || 'release' }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  development-image:
    name: Publish development container
    if: github.ref_name == 'development'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Calculate development build identity
        id: identity
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node .github/release-tools/release.mjs development "$SOURCE_SHA" "$REPOSITORY" "$BUILD_NUMBER"
          echo "BUILT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reuse an already published development version on retry
        id: existing
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          source .github/release-tools/registry-retry.sh
          if registry_retry docker buildx imagetools inspect "$IMAGE:$VERSION" > "$RUNNER_TEMP/development-image.txt" 2> "$RUNNER_TEMP/development-image-error.txt"; then
            registry_retry docker pull "$IMAGE:$VERSION"
            test "$(docker inspect "$IMAGE:$VERSION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
            test "$(docker inspect "$IMAGE:$VERSION" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|not found' "$RUNNER_TEMP/development-image-error.txt"; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/development-image-error.txt" >&2
            exit 1
          fi
      - name: Build development candidate
        id: candidate_build
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.version }}
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            BUILD_ATTEMPT=${{ env.BUILD_ATTEMPT }}
            CHANNEL=development
            BUILT_UTC=${{ env.BUILT_UTC }}
            WORKFLOW_URL=${{ env.WORKFLOW_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan development candidate
        id: candidate_scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.version }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Verify development runtime identity
        id: candidate_smoke
        env:
          IMAGE: ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.version }}
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash .github/release-tools/smoke-image.sh "$IMAGE" "$VERSION" "$SOURCE_SHA"
      - name: Publish development image without creating a release
        id: image_publish
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.identity.outputs.image }}:development-sha-${{ github.sha }}
            ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.version }}
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            BUILD_ATTEMPT=${{ env.BUILD_ATTEMPT }}
            CHANNEL=development
            BUILT_UTC=${{ env.BUILT_UTC }}
            WORKFLOW_URL=${{ env.WORKFLOW_URL }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Identify immutable development digest
        id: image
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          source .github/release-tools/registry-retry.sh
          digest="$(registry_retry docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          registry_retry docker pull "$IMAGE@$digest"
      - name: Scan published development digest
        id: published_scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.identity.outputs.image }}@${{ steps.image.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publish and verify immutable development release metadata
        id: metadata
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          CHANNEL: development
        run: bash .github/release-tools/publish-metadata.sh
      - name: Verify published image and update development alias
        id: alias
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: development
        run: |
          source .github/release-tools/registry-retry.sh
          registry_retry docker pull "$IMAGE@$DIGEST"
          bash .github/release-tools/smoke-image.sh "$IMAGE@$DIGEST" "$VERSION" "$SOURCE_SHA"
          bash .github/release-tools/update-alias.sh
          attempt="$(docker inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "io.romchecker.build-attempt"}}')"
          printf '## Development container\n\nVersion: %s\n\nBuild: %s (image build attempt %s)\n\nImage: %s:%s\n\nDigest: %s\n\nNo Git tag or GitHub release created.\n' "$VERSION" "$BUILD_NUMBER" "$attempt" "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Development delivery recovery summary
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          STATUS: ${{ job.status }}
          IMAGE: ${{ steps.identity.outputs.image }}
          VERSION: ${{ steps.identity.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "## Development delivery: $STATUS"
            echo 'Stage outcomes (skipped means not reached or an existing image was reused):'
            echo "$STEPS" | jq -r 'to_entries[] | "- \(.key): \(.value.outcome)"'
            printf '\nImage: %s:%s; resolved digest: %s\n' "${IMAGE:-unknown}" "${VERSION:-unknown}" "${DIGEST:-unknown}"
            echo "$STEPS" | jq -r '"Existing image reused: \(.existing.outputs.found // "unknown"); metadata verification: \(.metadata.outcome // "not reached"); alias moved: \(.alias.outputs.moved // "unknown")"'
            echo
            echo 'A failed publish can leave an image or metadata even when its step failed. Inspect the registry before changing anything.'
            echo 'For transient registry errors, rerun this delivery; for source defects, submit a new PR. Do not automatically roll back the branch or database.'
          } >> "$GITHUB_STEP_SUMMARY"
  publish:
    name: Publish checked release
    if: github.ref_name == 'beta' || github.ref_name == 'main'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read published release baselines
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .release
          gh api --paginate "repos/$REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' > .release/published-tags.txt
      - name: Plan release from source history
        id: plan
        env:
          BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/release-tools/release.mjs plan "$BRANCH" "$SOURCE_SHA" "$REPOSITORY" .release .release/published-tags.txt
      - name: Reserve immutable version for retry
        id: reserve
        run: node .github/release-tools/release.mjs reserve .release/release-plan.json
      - name: Stamp application and frontend version for this build
        id: stamp
        run: |
          node .github/release-tools/release.mjs stamp .release/release-plan.json
          echo "BUILT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Look for an existing immutable image
        id: existing
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          VERSION: ${{ steps.plan.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          source .github/release-tools/registry-retry.sh
          if registry_retry docker buildx imagetools inspect "$IMAGE:$VERSION" > .release/registry.txt 2> .release/registry-error.txt; then
            registry_retry docker pull "$IMAGE:$VERSION"
            test "$(docker inspect "$IMAGE:$VERSION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
            test "$(docker inspect "$IMAGE:$VERSION" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|not found' .release/registry-error.txt; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            cat .release/registry-error.txt >&2
            exit 1
          fi
      - name: Build candidate without publishing
        id: candidate_build
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.version }}
          build-args: |
            VERSION=${{ steps.plan.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            BUILD_ATTEMPT=${{ env.BUILD_ATTEMPT }}
            CHANNEL=${{ github.ref_name == 'main' && 'stable' || 'beta' }}
            BUILT_UTC=${{ env.BUILT_UTC }}
            WORKFLOW_URL=${{ env.WORKFLOW_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan candidate container
        id: candidate_scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.version }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Verify the exact candidate runtime and version
        id: candidate_smoke
        env:
          IMAGE: ${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.version }}
          VERSION: ${{ steps.plan.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash .github/release-tools/smoke-image.sh "$IMAGE" "$VERSION" "$SOURCE_SHA"
      - name: Publish immutable image with SBOM and provenance
        id: image_publish
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.version }}
          build-args: |
            VERSION=${{ steps.plan.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            BUILD_ATTEMPT=${{ env.BUILD_ATTEMPT }}
            CHANNEL=${{ github.ref_name == 'main' && 'stable' || 'beta' }}
            BUILT_UTC=${{ env.BUILT_UTC }}
            WORKFLOW_URL=${{ env.WORKFLOW_URL }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Identify and verify the published image
        id: image
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          VERSION: ${{ steps.plan.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          source .github/release-tools/registry-retry.sh
          digest="$(registry_retry docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          registry_retry docker pull "$IMAGE@$digest"
          bash .github/release-tools/smoke-image.sh "$IMAGE@$digest" "$VERSION" "$SOURCE_SHA"
          node .github/release-tools/release.mjs notes .release/release-plan.json "$digest"
          (cd .release && sha256sum release-manifest.json image-digest.txt > SHA256SUMS)
      - name: Scan published release digest
        id: published_scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.plan.outputs.image }}@${{ steps.image.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publish and verify immutable release metadata
        id: metadata
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          VERSION: ${{ steps.plan.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          CHANNEL: ${{ github.ref_name == 'main' && 'stable' || 'beta' }}
        run: bash .github/release-tools/publish-metadata.sh
      - name: Publish complete GitHub release
        id: release
        run: node .github/release-tools/release.mjs publish .release/release-plan.json
      - name: Update channel aliases only for the current branch head
        id: alias
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          bash .github/release-tools/update-alias.sh
      - name: Release summary
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf "## ROM Checker %s\n\nContainer: \`%s@%s\`\n\n" "$VERSION" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          cat .release/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Release delivery recovery summary
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          STATUS: ${{ job.status }}
          IMAGE: ${{ steps.plan.outputs.image }}
          VERSION: ${{ steps.plan.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "## Release delivery: $STATUS"
            echo 'Stage outcomes (skipped means not reached or an existing image was reused):'
            echo "$STEPS" | jq -r 'to_entries[] | "- \(.key): \(.value.outcome)"'
            printf '\nVersion: %s; image: %s; resolved digest: %s\n' "${VERSION:-unknown}" "${IMAGE:-unknown}" "${DIGEST:-unknown}"
            echo "$STEPS" | jq -r '"Existing image reused: \(.existing.outputs.found // "unknown"); metadata verification: \(.metadata.outcome // "not reached"); release verification: \(.release.outcome // "not reached"); alias moved: \(.alias.outputs.moved // "unknown")"'
            echo
            echo 'A failed step can still leave a reserved tag, image, metadata, draft or published release. Inspect the registry and release before recovery.'
            echo 'For transient registry errors, rerun this delivery; for source defects, submit a new PR. Do not automatically roll back the branch or database.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/
          retention-days: 90
  delivery-status:
    name: Delivery status
    if: always()
    needs: [checks, development-image, publish]
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize delivery gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo '## Delivery gate'
            echo "$RESULTS" | jq -r 'to_entries[] | "- \(.key): \(.value.result)"'
            echo 'If checks failed, publication was not started. Inspect the failed gate; rerun transient failures or fix source through a new PR.'
          } >> "$GITHUB_STEP_SUMMARY"
