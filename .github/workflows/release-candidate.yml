name: Release candidate

on:
  workflow_dispatch:
    inputs:
      internal_image_tag:
        description: Immutable image built from the release branch head
        required: true
        type: string
      target_version:
        description: Must match .github/release-config.json
        required: false
        type: string
      release_notes:
        description: Optional release candidate notes
        required: false
        type: string

permissions:
  checks: read
  contents: write
  packages: write

concurrency:
  group: romchecker-release-candidate
  cancel-in-progress: false

jobs:
  promote:
    name: Promote release-branch image to RC
    if: startsWith(github.ref_name, 'release/') || startsWith(github.ref_name, 'hotfix/')
    runs-on: ubuntu-24.04
    environment: release-candidate
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/phthisicus/rom-checker
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_TAG: ${{ inputs.internal_image_tag }}
      REQUESTED_TARGET: ${{ inputs.target_version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record publication time
        id: published
        run: echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate release target and branch head
        id: target
        run: |
          TARGET="$(jq -r .nextRelease .github/release-config.json)"
          node .github/release-tools/semver.mjs validate-target "$TARGET" >/dev/null
          if [[ -n "$REQUESTED_TARGET" && "$REQUESTED_TARGET" != "$TARGET" ]]; then
            echo "Requested target differs from the explicitly configured next release target." >&2
            exit 1
          fi
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          echo "version=$TARGET" >> "$GITHUB_OUTPUT"
      - name: Verify release branch image and CI
        id: source
        env:
          TARGET: ${{ steps.target.outputs.version }}
        run: |
          [[ "$SOURCE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-internal\.[1-9][0-9]*-[a-f0-9]{7}$ ]]
          docker pull "$IMAGE:$SOURCE_TAG"
          VERSION="$(docker inspect "$IMAGE:$SOURCE_TAG" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          CHANNEL="$(docker inspect "$IMAGE:$SOURCE_TAG" --format '{{index .Config.Labels "io.romchecker.channel"}}')"
          SOURCE_SHA="$(docker inspect "$IMAGE:$SOURCE_TAG" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          BUILD_NUMBER="$(docker inspect "$IMAGE:$SOURCE_TAG" --format '{{index .Config.Labels "io.romchecker.build-number"}}')"
          SCHEMA_VERSION="$(docker inspect "$IMAGE:$SOURCE_TAG" --format '{{index .Config.Labels "io.romchecker.schema-version"}}')"
          [[ "$CHANNEL" == internal && "$VERSION" == "$TARGET-internal.$BUILD_NUMBER+"* ]]
          [[ "$SOURCE_TAG" == "${VERSION/+/-}" && "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          gh api --paginate "repos/$GH_REPO/commits/$SOURCE_SHA/check-runs" \
            --jq '.check_runs[] | select(.name | endswith("Required checks")) | select(.head_sha == "'"$SOURCE_SHA"'") | .conclusion' \
            | grep -qx success
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$SOURCE_TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'version=%s\nsource_sha=%s\nbuild_number=%s\nschema_version=%s\ndigest=%s\n' \
            "$VERSION" "$SOURCE_SHA" "$BUILD_NUMBER" "$SCHEMA_VERSION" "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Allocate next RC version
        id: rc
        env:
          TARGET: ${{ steps.target.outputs.version }}
        run: |
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | .tag_name | ltrimstr("v")' \
            > "$RUNNER_TEMP/versions.txt"
          VERSION="$(node .github/release-tools/semver.mjs next-prerelease rc "$TARGET" "$RUNNER_TEMP/versions.txt")"
          TAG="$(node .github/release-tools/semver.mjs docker-tag "$VERSION")"
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Release tag v$VERSION already exists; refusing duplicate publication." >&2
            exit 1
          fi
          printf 'version=%s\ntag=%s\n' "$VERSION" "$TAG" >> "$GITHUB_OUTPUT"
      - name: Promote the existing digest without rebuilding
        env:
          SOURCE_REF: ${{ env.IMAGE }}@${{ steps.source.outputs.digest }}
          TARGET_TAG: ${{ steps.rc.outputs.tag }}
          EXPECTED_DIGEST: ${{ steps.source.outputs.digest }}
        run: bash .github/release-tools/promote-image.sh
      - name: Publish RC metadata for the exact promoted digest
        id: manifest
        env:
          CHANNEL: rc
          VERSION: ${{ steps.rc.outputs.version }}
          BUILD_VERSION: ${{ steps.source.outputs.version }}
          IMAGE_TAG: ${{ steps.rc.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.source.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BUILD_NUMBER: ${{ steps.source.outputs.build_number }}
          SCHEMA_VERSION: ${{ steps.source.outputs.schema_version }}
          PUBLISHED_UTC: ${{ steps.published.outputs.utc }}
          RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.rc.outputs.version }}
        run: bash .github/release-tools/publish-channel-manifest.sh
      - name: Publish RC release record
        env:
          VERSION: ${{ steps.rc.outputs.version }}
          TARGET_TAG: ${{ steps.rc.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BUILD_VERSION: ${{ steps.source.outputs.version }}
          BUILD_NUMBER: ${{ steps.source.outputs.build_number }}
          SCHEMA_VERSION: ${{ steps.source.outputs.schema_version }}
          DIGEST: ${{ steps.source.outputs.digest }}
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.manifest_digest }}
          PUBLISHED_UTC: ${{ steps.published.outputs.utc }}
        run: |
          # shellcheck disable=SC2016
          mkdir -p "$RUNNER_TEMP/romchecker-release"
          NOTES="$RELEASE_NOTES"
          if [[ -z "$NOTES" ]]; then
            NOTES="Release candidate from $GITHUB_REF_NAME. Promoted existing image $BUILD_VERSION without rebuilding."
          fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/romchecker-release/notes.md"
          jq -n \
            --arg channel rc --arg version "$VERSION" --arg buildVersion "$BUILD_VERSION" \
            --arg image "$IMAGE" --arg tag "$TARGET_TAG" --arg digest "$DIGEST" \
            --arg commit "$SOURCE_SHA" --arg build "$BUILD_NUMBER" \
            --arg schema "$SCHEMA_VERSION" --arg manifestDigest "$MANIFEST_DIGEST" \
            "{formatVersion:1,channel:\$channel,version:\$version,buildVersion:\$buildVersion,image:\$image,tag:\$tag,digest:\$digest,commit:\$commit,buildNumber:(\$build|tonumber),schemaVersion:(\$schema|tonumber),channelManifestDigest:\$manifestDigest}" \
            > "$RUNNER_TEMP/romchecker-release/release-manifest.json"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "$RUNNER_TEMP/romchecker-release/image-digest.txt"
          gh release create "v$VERSION" --target "$SOURCE_SHA" --prerelease \
            --title "ROM Checker $VERSION — Release Candidate" \
            --notes-file "$RUNNER_TEMP/romchecker-release/notes.md"
          gh release upload "v$VERSION" \
            "$RUNNER_TEMP/romchecker-release/release-manifest.json" \
            "$RUNNER_TEMP/romchecker-release/image-digest.txt"
          printf '## ROM Checker %s (RC)\n\nImage: `%s:%s`\n\nDigest: `%s`\n\nSource: `%s`\n' \
            "$VERSION" "$IMAGE" "$TARGET_TAG" "$DIGEST" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
