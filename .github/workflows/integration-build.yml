name: Integration build

on:
  push:
    branches:
      - develop
      - 'release/**'
      - 'hotfix/**'

permissions:
  contents: read

concurrency:
  group: romchecker-internal-build-number
  cancel-in-progress: false

jobs:
  checks:
    name: Complete CI validation
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and verify immutable integration image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/phthisicus/rom-checker
      BUILD_ATTEMPT: ${{ github.run_attempt }}
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Allocate persistent internal build number
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: node .github/release-tools/allocate-internal-build.mjs
      - name: Prepare build timestamp
        run: echo "BUILT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse to overwrite an immutable version tag
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          TAG="$(node .github/release-tools/semver.mjs docker-tag "$VERSION")"
          if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing immutable image tag $TAG." >&2
            exit 1
          fi
      - name: Build and publish exact internal image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.identity.outputs.docker_tag }}
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_NUMBER=${{ steps.identity.outputs.build_number }}
            BUILD_ATTEMPT=${{ github.run_attempt }}
            CHANNEL=internal
            BUILT_UTC=${{ env.BUILT_UTC }}
            WORKFLOW_URL=${{ env.WORKFLOW_URL }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the image and digest
        id: verify
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          TAG="${{ steps.identity.outputs.docker_tag }}"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "$IMAGE:$TAG"
          bash .github/release-tools/smoke-image.sh "$IMAGE:$TAG" "$VERSION" "$SOURCE_SHA"
          RESOLVED="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$RESOLVED" == "$DIGEST" ]]
          SCHEMA_VERSION="$(docker inspect "$IMAGE:$TAG" --format '{{index .Config.Labels "io.romchecker.schema-version"}}')"
          [[ "$SCHEMA_VERSION" =~ ^[1-9][0-9]*$ ]]
          printf 'digest=%s\nschema_version=%s\n' "$DIGEST" "$SCHEMA_VERSION" >> "$GITHUB_OUTPUT"
      - name: Promote develop build to internal convenience tag
        if: github.ref_name == 'develop'
        env:
          SOURCE_TAG: ${{ steps.identity.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:internal" "$IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:internal" --format '{{json .Manifest}}' | jq -r .digest)" = "$DIGEST"
      - name: Publish internal channel manifest
        if: github.ref_name == 'develop'
        id: channel
        env:
          IMAGE_TAG: ${{ steps.identity.outputs.docker_tag }}
          VERSION: ${{ steps.identity.outputs.version }}
          BUILD_VERSION: ${{ steps.identity.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ steps.identity.outputs.build_number }}
          SCHEMA_VERSION: ${{ steps.verify.outputs.schema_version }}
          PUBLISHED_UTC: ${{ env.BUILT_UTC }}
          CHANNEL: internal
          RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
        run: bash .github/release-tools/publish-channel-manifest.sh
      - name: Build record
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # shellcheck disable=SC2016
          {
            printf '## Internal image\n\nVersion: `%s`\n\nImage: `%s:%s`\n\nDigest: `%s`\n\nSource: `%s`\n' \
              "$VERSION" "$IMAGE" "$(node .github/release-tools/semver.mjs docker-tag "$VERSION")" "$DIGEST" "$GITHUB_SHA"
            if [[ "$GITHUB_REF_NAME" == develop ]]; then
              echo 'This image is available on the internal update channel.'
            else
              echo 'Release-branch build; not published to a moving update channel.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
